services:
  axeng:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: axeng
    restart: unless-stopped
    volumes:
      # Mount your config and .env
      - ./config:/app/config:ro
      - ./.env:/app/.env:ro

      # Convenience scripts (axeng-start/stop/logs/update)
      - ./bin:/app/bin:ro

      # Optional: persist Obsidian vault
      - ./vault:/app/vault

      # Optional: persist generated reports
      - ./reports:/app/reports

      # GitHub CLI auth (so you don't need GITHUB_TOKEN env var)
      - ~/.config/gh:/root/.config/gh:ro

      # Hermes home (for API keys, Google tokens used by the tools)
      - ~/.hermes:/root/.hermes:ro
    environment:
      - PYTHONPATH=/app/src
    command: >
      sh -c "
        # Copy config from example if not exists
        cp config/config.yaml.example config/config.yaml 2>/dev/null || true;

        # Run the Streamlit web UI (always-on for self-hosted)
        streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --browser.gatherUsageStats false
      "
    ports:
      - "8501:8501"

