[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axeng"
version = "2.3.0"
description = "Autonomous AI chief of staff for engineering leaders"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
keywords = ["engineering-manager", "ai", "standup", "sprint", "github", "linear"]

authors = [
    {name = "Rui Machado"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Engineering Managers",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.32.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
full = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "anthropic>=0.20.0",
    "openai>=1.30.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.0.0",
]
nextjs = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ruimachado-orbit/axeng"
Repository = "https://github.com/ruimachado-orbit/axeng"
Documentation = "https://github.com/ruimachado-orbit/axeng#readme"

[project.scripts]
axeng = "axeng.__main__:main"

[tool.setuptools.packages.find]
include = ["axeng", "axeng.*"]