services:
  axeng:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: axeng
    restart: unless-stopped
    volumes:
      # Mount your config and .env
      - ./config:/app/config:ro
      - ./.env:/app/.env:ro

      # Convenience scripts (axeng-start/stop/logs/update)
      - ./bin:/app/bin:ro

      # Optional: persist Obsidian vault
      - ./vault:/app/vault

      # Optional: persist generated reports
      - ./reports:/app/reports

      # GitHub CLI auth (so you don't need GITHUB_TOKEN env var)
      - ~/.config/gh:/root/.config/gh:ro

      # Hermes home (for API keys, Google tokens used by the tools)
      - ~/.axeng:/root/.axeng:ro
    environment:
      - PYTHONPATH=/app/axeng
    command: >-
      sh -c "
        python -m uvicorn ui.nextjs.api_server:app --host 0.0.0.0 --port 3457
      "
    ports:
      - "3457:3457"

